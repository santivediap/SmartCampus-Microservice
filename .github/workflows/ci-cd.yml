name: SmartCampus CI-CD

on:
  push:
    branches:
      - main
      - develop
      - ci-cd-workflow
  pull_request:
    branches:
      - main
      - develop
      - ci-cd-workflow

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/smartcampus-backend

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      # Cancela la ejecucion si una version falla
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    
    # Add PostgreSQL services 
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: smartcampus
          POSTGRES_DB: smartcampus
          # Esta línea le dice a PostgreSQL que acepte conexiones sin contraseña
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Etapa 1 — Checkout
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true # Acelera las ejecuciones futuras guardando caché
      
      # Matrix en GitHub Actions
      - name: Config Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      # Etapa 2 — Instalación
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --no-dev
      
      # Etapa 3 — Calidad
      - name: Quality analysis (Linting)
        working-directory: ./backend
        # Look for syntax errors, unused variables, or bad practices.
        run: uv run ruff check .

      - name: Format verification
        working-directory: ./backend
        # Verify that the code is correctly tabulation and order (without modifying it).
        run: uv run ruff format --check .
      
      # Etapa 4: Test
      - name: Execute automated tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://smartcampus@localhost:5432/smartcampus
        run: uv run pytest

  build-image:
    runs-on: ubuntu-latest
    needs: run-tests # Ensures that stage 5 will only be executed if Stage 3 and the tests have passed
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Config docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login in Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Etapa 5 — Build
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          # It tells Docker to use the Dockerfile in this folder.
          context: ./backend
          # Sube la imagen a Docker Hub solo si estamos en main.
          push: ${{ github.ref == 'refs/heads/main' }}
          # Despues de construir la imagen, la guarde en el sistema local Nota:Necesario para la etapa 6.
          load: true
          tags: ${{ env.IMAGE_REPOSITORY }}:latest
      
      # Etapa 6 - Validation
      - name: Ejecutar y comprobar contenedor
        run: |
          # Crear una red de Docker para la comunicacion entre contenedores
          docker network create test-net

          # Iniciar base de datos temporal en esa red
          docker run -d --name test-db --network test-net \
            -e POSTGRES_USER=smartcampus \
            -e POSTGRES_DB=smartcampus \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:15
            
          # Tiempo para que arranque la DB
          sleep 3

          # Iniciar el contenedor en segundo plano (-d) conectándolo a la misma red inyectando las variables individuales que lee Flask
          docker run -d -p 5000:5000 --name smartcampus-solutions-app --network test-net \
            -e DB_HOST=test-db \
            -e DB_USER=smartcampus \
            -e DB_NAME=smartcampus \
            -e DATABASE_URL=postgresql://smartcampus@test-db:5432/smartcampus \
            ${{ env.IMAGE_REPOSITORY }}:latest

          # Esperar 5 segundos para darle tiempo a Flask (vía uv run) de arrancar
          sleep 5
          
          # Comprobar el estado del contenedor
          ESTADO=$(docker inspect -f '{{.State.Running}}' smartcampus-solutions-app)
          
          if [ "$ESTADO" = "true" ]; then
            echo "✅ Validación correcta: El contenedor está iniciado y ejecutándose."
          else
            echo "❌ Error: El contenedor se apagó inesperadamente o no responde. Mostrando logs:"
            docker logs smartcampus-solutions-app
            exit 1
          fi
  
  deploy-app:
    needs: build-image # Solo se ejecuta si la imagen se construyó y validó con éxito
    runs-on: self-hosted # Ejecuta los comandos en tu propia máquina configurada
    
    # Opcional pero muy recomendado: Solo desplegar si los cambios se hacen en la rama "main"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Download the code
        uses: actions/checkout@v4
        
      - name: Etapa 7 — Deploy
        run: |
          echo "Iniciando despliegue automatizado..."
          
          # Descargar la imagen más reciente desde Docker Hub
          docker compose pull
          
          # Levantar la base de datos persistente y la nueva versión de la app (-d las deja corriendo en segundo plano)
          docker compose up -d
          
          # Limpiar imágenes viejas reduciendo la memoria en el disco
          docker image prune -f
          
          echo "✅ Despliegue completado con éxito."