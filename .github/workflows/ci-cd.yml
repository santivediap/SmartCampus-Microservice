name: SmartCampus CI-CD

on:
  push:
    branches:
      - main
      - develop
      - ci-cd-workflow
  pull_request:
    branches:
      - main
      - develop
      - ci-cd-workflow

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/smartcampus-backend

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      # Cancela la ejecucion si una version falla
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    
    # Add PostgreSQL services 
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: smartcampus
          POSTGRES_DB: smartcampus
          # Esta línea le dice a PostgreSQL que acepte conexiones sin contraseña
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Etapa 1 — Checkout
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true # Acelera las ejecuciones futuras guardando caché
      
      # Matrix en GitHub Actions
      - name: Config Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      # Etapa 2 — Instalación
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --no-dev
      
      # Etapa 3 — Calidad
      - name: Quality analysis (Linting)
        working-directory: ./backend
        # Look for syntax errors, unused variables, or bad practices.
        run: uv run ruff check .

      - name: Format verification
        working-directory: ./backend
        # Verify that the code is correctly tabulation and order (without modifying it).
        run: uv run ruff format --check .
      
      # Etapa 4: Test
      - name: Execute automated tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: smartcampus
        run: uv run pytest
  
  build-image:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Stage 5 — Build (local only, nothing is published yet)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: smartcampus:${{ github.sha }}

      # Stage 6 — Validation: app must answer /health (which also queries the DB)
      - name: Run container and check /health
        run: |
          docker network create test-net
          docker run -d --name test-db --network test-net \
            -e POSTGRES_USER=smartcampus -e POSTGRES_DB=smartcampus \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:15

          # TCP check: the init-time temp server only listens on the unix socket
          for i in $(seq 30); do
            docker exec test-db pg_isready -h localhost -U smartcampus && break
            sleep 2
          done

          docker run -d --name app --network test-net -p 5000:5000 \
            -e DB_HOST=test-db smartcampus:${{ github.sha }}

          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            http://localhost:5000/health || { docker logs app; exit 1; }

      # Publish only validated images, only on push to main
      - name: Login to Docker Hub
        
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        
        run: |
          docker tag smartcampus:${{ github.sha }} $IMAGE_REPOSITORY:${{ github.sha }}
          docker tag smartcampus:${{ github.sha }} $IMAGE_REPOSITORY:latest
          docker push --all-tags $IMAGE_REPOSITORY

  deploy-app:
    needs: build-image
    runs-on: self-hosted
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      # Stage 7 — Deploy: secrets injected at runtime, never written to the repo
      - name: Deploy with Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker compose pull backend
          docker compose up -d --wait
          docker image prune -f