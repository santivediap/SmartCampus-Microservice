name: SmartCampus CI-CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  IMAGE_REPOSITORY: hansjeffa/smartcampus-microservice

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Basic syntax test
        # Como no tenemos tests configurados, solo verificamos que flask funcione
        run: uv run flask --version

  build-image:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Config docker buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:latest