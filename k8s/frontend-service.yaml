# Exposes the web UI outside the cluster.
# Minikube: "minikube service frontend-service -n smartcampus" or http://$(minikube ip):30080
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smartcampus
  labels:
    app: frontend
    app.kubernetes.io/part-of: smartcampus
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080