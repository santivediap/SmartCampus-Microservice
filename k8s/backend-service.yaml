# Internal load balancer across all backend Pods (reached by the frontend's nginx)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: smartcampus
  labels:
    app: backend
    app.kubernetes.io/part-of: smartcampus
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
