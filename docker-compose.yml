services:
  # Base de datos permanente
  db:
    image: postgres:15
    container_name: smartcampus-db
    restart: always
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_DB: smartcampus
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db_data:/var/lib/postgresql/data

  # Tu aplicación web
  backend:
    # Asegúrate de usar el mismo nombre de repositorio que en tu ci-cd.yml
    image: hansjeffa/smartcampus-backend:latest
    container_name: smartcampus-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: smartcampus
      DB_NAME: smartcampus
      DATABASE_URL: postgresql://smartcampus@db:5432/smartcampus
    depends_on:
      - db

volumes:
  db_data: