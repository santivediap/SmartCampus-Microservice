services:
  # Persistent database
  db:
    image: postgres:15
    container_name: smartcampus-db
    restart: always
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_DB: smartcampus
      # Injected from GitHub Secrets via the workflow env
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smartcampus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Bind only to localhost so the DB is reachable from host tests, not the network
      - "127.0.0.1:5432:5432"

  # REST API
  backend:
    # Commit SHA from the workflow; falls back to latest for local runs
    image: hansjeffa/smartcampus-backend:${IMAGE_TAG:-latest}
    # Used by "docker compose up --build" when developing locally
    build: ./backend
    container_name: smartcampus-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: smartcampus
      DB_NAME: smartcampus
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    networks:
      - smartcampus-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Web UI: nginx serves the React build and proxies /api/* to the backend
  frontend:
    image: hansjeffa/smartcampus-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    container_name: smartcampus-frontend
    restart: always
    ports:
      - "8080:80"
    environment:
      # Service name resolved by Docker's internal DNS on smartcampus-net
      BACKEND_URL: http://backend:5000
    networks:
      - smartcampus-net
    depends_on:
      backend:
        condition: service_healthy
    # Healthcheck is defined in frontend/Dockerfile

networks:
  smartcampus-net:
    driver: bridge

volumes:
  db_data:
